<body>
    <h1>Hello World! This is my public test page.</h1>

<script type='text/javascript'>
	function goodyearIsMobileBrowser() {
		var ua = navigator.userAgent || '';
		if (/Android.+Mobile|iPhone|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
			return true;
		}
		if (navigator.userAgentData && navigator.userAgentData.mobile === true) {
			return true;
		}
		return !!(window.matchMedia && window.matchMedia('(max-width: 768px)').matches);
	}

	function hideSalesforceChatButton() {
		if (!goodyearIsMobileBrowser()) {
			return;
		}
		var api = window.embeddedservice_bootstrap && window.embeddedservice_bootstrap.utilAPI;
		if (!api || typeof api.hideChatButton !== 'function') {
			return;
		}
		try {
			var result = api.hideChatButton();
			if (result && typeof result.catch === 'function') {
				result.catch(function () {});
			}
		} catch (err) {
			console.warn('[Goodyear Chat] hideChatButton failed:', err);
		}
	}

	function showSalesforceChatButton() {
		var api = window.embeddedservice_bootstrap && window.embeddedservice_bootstrap.utilAPI;
		if (!api || typeof api.showChatButton !== 'function') {
			return;
		}
		try {
			var result = api.showChatButton();
			if (result && typeof result.catch === 'function') {
				result.catch(function () {});
			}
		} catch (err) {
			console.warn('[Goodyear Chat] showChatButton failed:', err);
		}
	}

	// Mobile: hide the default launcher on create and again after minimize.
	// https://developer.salesforce.com/docs/service/messaging-web/guide/show-hide-chat.html
	window.addEventListener('onEmbeddedMessagingButtonCreated', hideSalesforceChatButton);
	window.addEventListener('onEmbeddedMessagingWindowMinimized', hideSalesforceChatButton);

	function initEmbeddedMessaging() {
		if (!document.body) {
			document.addEventListener('DOMContentLoaded', initEmbeddedMessaging);
			return;
		}

		try {
			embeddedservice_bootstrap.settings.language = 'en_US'; // For example, enter 'en' or 'en-US'
			embeddedservice_bootstrap.settings.display = 'Chat with Support';
			if (goodyearIsMobileBrowser()) {
				embeddedservice_bootstrap.settings.hideChatButtonOnLoad = true;
			}
			embeddedservice_bootstrap.init(
				'00DTI000002wPxm',
				'GY_Service_Chat_Support',
				'https://goodyearmvp--elevatedev.sandbox.my.site.com/ESWGYServiceChatSuppor1779987171907',
				{
					scrt2URL: 'https://goodyearmvp--elevatedev.sandbox.my.salesforce-scrt.com'
				}
			);
		} catch (err) {
			console.error('Error loading Embedded Messaging: ', err);
		}
	};
</script>
<script type='text/javascript' src='https://goodyearmvp--elevatedev.sandbox.my.site.com/ESWGYServiceChatSuppor1779987171907/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>

<script type='text/javascript'>
(function () {
    // Prevent the script from initializing multiple times
    if (window.goodyearChatChipRelayInitialized) {
        return;
    }
    window.goodyearChatChipRelayInitialized = true;

    var allowedOrigins = [
        // VF host page origin
        window.location.origin,
        // Embedded Messaging / Experience Cloud host origin
        'https://goodyearmvp--elevatedev.sandbox.my.site.com',
        'https://ryan-yin-gy.github.io',
        // Optional VF canonical domain variant
        'https://goodyearmvp--elevatedev--c.sandbox.vf.force.com'
    ];

    // Helper: Safely wait for the Chat API to be ready before sending any messages
    function waitForSendTextMessage(callback, retryCount) {
        retryCount = retryCount || 0;

        if (
            window.embeddedservice_bootstrap &&
            window.embeddedservice_bootstrap.utilAPI &&
            typeof window.embeddedservice_bootstrap.utilAPI.sendTextMessage === 'function'
        ) {
            callback(window.embeddedservice_bootstrap.utilAPI.sendTextMessage);
            return;
        }

        if (retryCount >= 20) {
            console.error('[Goodyear Chat Relay] sendTextMessage is still not available.');
            return;
        }

        setTimeout(function () {
            waitForSendTextMessage(callback, retryCount + 1);
        }, 250);
    }

// =======================================================================
    // FEATURE 1: Send automatic message when bot first joins
    // =======================================================================
    window.addEventListener("onEmbeddedMessagingFirstBotMessageSent", function() {
        console.log("[Goodyear Chat Relay] Received onEmbeddedMessagingFirstBotMessageSent event.");
        // ADDED: A 1-second delay to prevent the race condition
        setTimeout(function() {
            console.log("[Goodyear Chat Relay] Delay complete, attempting to send auto-message...");
            waitForSendTextMessage(function (sendTextMessage) {
                sendTextMessage
                    .call(window.embeddedservice_bootstrap.utilAPI, "[Initializing Main Menu...]")
                    .then(function () {
                        console.log("[Goodyear Chat Relay] Auto-Message sent successfully.");
                    })
                    .catch(function (error) {
                        console.error("[Goodyear Chat Relay] Auto-Message failed:", error);
                    });
            });
        }, 1000); // 1000 milliseconds = 1 second
    });

    // =======================================================================
    // FEATURE 2: Listen for Chip clicks from the LWC and send them
    // =======================================================================
    window.addEventListener('message', function (event) {
        // Security check
        if (allowedOrigins.indexOf(event.origin) === -1) {
            console.warn('[Goodyear Chat Relay] Ignored message from origin:', event.origin);
            return;
        }

        var data = event.data;

        // Ensure the message is actually from our LWC chip component
        if (!data || data.type !== 'goodyear.chatChipSelected') {
            return;
        }

        var selectedValue = data.payload && data.payload.value;

        if (!selectedValue) {
            console.error('[Goodyear Chat Relay] No selected value received.');
            return;
        }

        console.log('[Goodyear Chat Relay] Received chip selection:', selectedValue);

        // Send the chip text into the chat
        waitForSendTextMessage(function (sendTextMessage) {
            sendTextMessage
                .call(window.embeddedservice_bootstrap.utilAPI, selectedValue)
                .then(function () {
                    console.log('[Goodyear Chat Relay] Sent chip text to chat:', selectedValue);
                })
                .catch(function (error) {
                    console.error('[Goodyear Chat Relay] sendTextMessage failed:', error);
                });
        });
    });

    console.log('[Goodyear Chat Relay] Initialized with auto-message and LWC listener.');
})();

// =======================================================================
// FEATURE 3: Hide default system caption text above rendered cards
// =======================================================================
(function initGoodyearCaptionCleaner() {
    if (window.goodyearCaptionCleanerInitialized) {
        return;
    }
    window.goodyearCaptionCleanerInitialized = true;

    var TARGET_TEXT = 'Here are the results:';

    function normalize(text) {
        return (text || '').replace(/\s+/g, ' ').trim().toLowerCase();
    }

    function hideIfDefaultCaption(node) {
        if (!node || node.nodeType !== 1) {
            return;
        }

        var candidates = [node];
        var descendants = node.querySelectorAll('*');
        for (var i = 0; i < descendants.length; i++) {
            candidates.push(descendants[i]);
        }

        for (var j = 0; j < candidates.length; j++) {
            var element = candidates[j];
            var text = normalize(element.textContent);
            if (text === normalize(TARGET_TEXT)) {
                var isShort = (element.textContent || '').trim().length <= 40;
                if (isShort) {
                    element.style.display = 'none';
                }
            }
        }
    }

    function scanAll(root) {
        if (!root) {
            return;
        }
        hideIfDefaultCaption(root);
        var all = root.querySelectorAll('*');
        for (var i = 0; i < all.length; i++) {
            hideIfDefaultCaption(all[i]);
        }
    }

    function startObserver(root) {
        var observer = new MutationObserver(function (mutations) {
            for (var i = 0; i < mutations.length; i++) {
                var mutation = mutations[i];
                for (var j = 0; j < mutation.addedNodes.length; j++) {
                    var added = mutation.addedNodes[j];
                    if (added.nodeType === 1) {
                        scanAll(added);
                    }
                }
            }
        });

        observer.observe(root, { childList: true, subtree: true });
        scanAll(root);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
            startObserver(document.body);
        });
    } else {
        startObserver(document.body);
    }
})();

// =======================================================================
// FEATURE 4: Mobile-only small launcher.
// Desktop is unchanged (Salesforce original button).
// Pattern: hideChatButtonOnLoad + hideChatButton() + launchChat()
// https://developer.salesforce.com/docs/service/messaging-web/guide/show-hide-chat.html
// https://salesforce.stackexchange.com/questions/438449/hide-chat-button-in-messaging-web-not-working-unable-to-hide-standard-embedded
// =======================================================================
(function initGoodyearCustomChatButton() {
    if (window.goodyearCustomChatButtonInitialized) {
        return;
    }
    window.goodyearCustomChatButtonInitialized = true;

    var BUTTON_ID = 'gyCustomChatButton';
    var chatWindowIsOpen = false;

    function isMobileBrowser() {
        if (typeof goodyearIsMobileBrowser === 'function') {
            return goodyearIsMobileBrowser();
        }
        var ua = navigator.userAgent || '';
        if (/Android.+Mobile|iPhone|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
            return true;
        }
        return !!(window.matchMedia && window.matchMedia('(max-width: 768px)').matches);
    }

    function injectStyles() {
        if (document.getElementById('gy-custom-chat-button-styles')) {
            return;
        }

        var style = document.createElement('style');
        style.id = 'gy-custom-chat-button-styles';
        style.type = 'text/css';
        style.appendChild(document.createTextNode(
            'html.gy-chat-is-mobile .embeddedMessagingConversationButtonWrapper,' +
            'html.gy-chat-is-mobile #embeddedMessagingConversationButton,' +
            'html.gy-chat-is-mobile button.embeddedMessagingConversationButton{' +
            'display:none !important;visibility:hidden !important;' +
            'opacity:0 !important;pointer-events:none !important;' +
            '}' +
            'html.gy-chat-is-mobile iframe.embeddedMessagingFrame.isMinimized{' +
            'display:none !important;visibility:hidden !important;' +
            'opacity:0 !important;pointer-events:none !important;' +
            '}' +
            '#' + BUTTON_ID + '{' +
            'position:fixed;z-index:2147483001;right:12px;bottom:12px;' +
            'width:44px;height:44px;padding:0;border:0;border-radius:50%;' +
            'background:#FFCC00;color:#111;cursor:pointer;' +
            'box-shadow:0 4px 12px rgba(0,0,0,.28);display:none !important;' +
            'align-items:center;justify-content:center;' +
            '}' +
            '#' + BUTTON_ID + ' svg{width:20px;height:20px;display:block;}' +
            'html.gy-chat-is-mobile #' + BUTTON_ID + '{display:flex !important;}' +
            'html.gy-chat-is-mobile #' + BUTTON_ID + '.is-hidden{display:none !important;}' +
            '#' + BUTTON_ID + ':disabled{opacity:.7;cursor:wait;}'
        ));
        (document.head || document.documentElement).appendChild(style);
    }

    function getCustomButton() {
        return document.getElementById(BUTTON_ID);
    }

    function isLaunchApiReady() {
        var api = window.embeddedservice_bootstrap && window.embeddedservice_bootstrap.utilAPI;
        return !!(api && typeof api.launchChat === 'function');
    }

    function showCustomButton() {
        var button = getCustomButton();
        if (!button) {
            return;
        }
        button.classList.remove('is-hidden');
        button.disabled = !isLaunchApiReady();
    }

    function hideCustomButton() {
        var button = getCustomButton();
        if (!button) {
            return;
        }
        button.classList.add('is-hidden');
        button.disabled = false;
    }

    function launchGoodyearChat() {
        var api = window.embeddedservice_bootstrap && window.embeddedservice_bootstrap.utilAPI;
        var button = getCustomButton();

        if (!api || typeof api.launchChat !== 'function') {
            console.error('[Goodyear Chat] launchChat is not available yet.');
            return;
        }

        if (button) {
            button.disabled = true;
        }

        api.launchChat()
            .then(function () {
                hideCustomButton();
            })
            .catch(function (error) {
                console.error('[Goodyear Chat] launchChat failed:', error);
                showCustomButton();
            });
    }

    function ensureCustomButton() {
        if (!document.body) {
            document.addEventListener('DOMContentLoaded', ensureCustomButton);
            return;
        }
        if (getCustomButton()) {
            return;
        }

        var button = document.createElement('button');
        button.id = BUTTON_ID;
        button.type = 'button';
        button.setAttribute('aria-label', 'Chat with Support');
        button.innerHTML =
            '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
            '<path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8.4L4 20.5V6a2 2 0 0 1 2-2z"></path>' +
            '</svg>';
        button.addEventListener('click', launchGoodyearChat);
        document.body.appendChild(button);
        showCustomButton();
    }

    function waitForChatApi() {
        if (isLaunchApiReady()) {
            applyMobileMode();
            return;
        }

        var attempts = 0;
        var timer = setInterval(function () {
            attempts += 1;
            if (isLaunchApiReady() || attempts >= 40) {
                clearInterval(timer);
                applyMobileMode();
            }
        }, 250);
    }

    function applyMobileMode() {
        var mobile = isMobileBrowser();
        document.documentElement.classList.toggle('gy-chat-is-mobile', mobile);

        if (mobile) {
            ensureCustomButton();
            if (typeof hideSalesforceChatButton === 'function') {
                hideSalesforceChatButton();
            }
            if (chatWindowIsOpen) {
                hideCustomButton();
            } else {
                showCustomButton();
            }
            return;
        }

        hideCustomButton();
        if (typeof showSalesforceChatButton === 'function') {
            showSalesforceChatButton();
        }
    }

    injectStyles();
    ensureCustomButton();
    applyMobileMode();
    waitForChatApi();

    window.addEventListener('resize', applyMobileMode);
    window.addEventListener('orientationchange', applyMobileMode);
    if (window.matchMedia) {
        var mobileQuery = window.matchMedia('(max-width: 768px)');
        if (mobileQuery.addEventListener) {
            mobileQuery.addEventListener('change', applyMobileMode);
        } else if (mobileQuery.addListener) {
            mobileQuery.addListener(applyMobileMode);
        }
    }

    window.addEventListener('onEmbeddedMessagingReady', applyMobileMode);

    window.addEventListener('onEmbeddedMessagingButtonCreated', applyMobileMode);

    window.addEventListener('onEmbeddedMessagingWindowMaximized', function () {
        chatWindowIsOpen = true;
        hideCustomButton();
    });

    window.addEventListener('onEmbeddedMessagingWindowMinimized', function () {
        chatWindowIsOpen = false;
        applyMobileMode();
    });

    window.addEventListener('onEmbeddedMessagingWindowClosed', function () {
        chatWindowIsOpen = false;
        applyMobileMode();
    });

    window.addEventListener('onEmbeddedMessagingConversationClosed', function () {
        chatWindowIsOpen = false;
        applyMobileMode();
    });
})();
</script>
